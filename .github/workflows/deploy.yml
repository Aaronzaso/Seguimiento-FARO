name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Publicar el Excel más reciente de datos/
        run: |
          latest=$(ls datos/*.xlsx 2>/dev/null | sort | tail -n 1)
          if [ -n "$latest" ]; then
            mkdir -p app/dist/datos
            cp "$latest" app/dist/datos/FARO_Cronograma.xlsx
            echo "Publicado: $latest"
          else
            echo "No hay Excel en datos/ — se despliega sin datos publicados."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
